<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Entradas Avengers Doomsday</title>
<link rel="stylesheet" href="fonts/local.css">
<style>
  :root {
    --bg-1: #16241d;
    --bg-2: #0b120e;
    --bg-3: #060907;
    --accent: #6fd69c;
    --accent-ink: #1a7a47;
    --paper-1: #f7f9f8;
    --paper-2: #e4eae7;
    --ink: #111a15;
    --ink-soft: #5d6b64;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg-3); }
  body {
    width: var(--w); height: var(--h);
    position: relative; overflow: hidden;
    font-family: 'Montserrat', sans-serif; color: #fff;
    background:
      radial-gradient(ellipse 70% 45% at 50% 0%, var(--bg-1) 0%, transparent 100%),
      radial-gradient(ellipse 90% 60% at 50% 70%, #0f1c15 0%, transparent 100%),
      linear-gradient(180deg, var(--bg-2), var(--bg-3));
  }
  #dust { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* soft projector beam */
  .beam {
    position: absolute; left: 50%; top: -40px; transform: translateX(-50%);
    background: linear-gradient(180deg, rgba(190, 240, 210, .16), rgba(190, 240, 210, 0) 85%);
    clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%);
    filter: blur(28px);
  }
  .grain {
    position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  /* eyebrow */
  .eyebrow {
    display: flex; align-items: center; white-space: nowrap;
    font-weight: 600; text-transform: uppercase; color: var(--accent);
  }
  .eyebrow::before, .eyebrow::after {
    content: ""; height: 1.5px;
    background: linear-gradient(90deg, transparent, rgba(111, 214, 156, .7));
  }
  .eyebrow::after { transform: scaleX(-1); }

  /* title */
  .title { text-align: center; line-height: .92; }
  .t1 {
    display: block; font-family: 'Anton', sans-serif; text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 0%, #e3e8eb 45%, #9aa4aa 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 8px 20px rgba(0, 0, 0, .55));
  }
  .t2 {
    display: block; font-family: 'Cinzel', serif; font-weight: 700; text-transform: uppercase;
    background: linear-gradient(180deg, #d9f5e5 0%, #8fdcb0 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ticket */
  .ticket { display: flex; filter: drop-shadow(0 30px 50px rgba(0, 0, 0, .55)) drop-shadow(0 0 60px rgba(111, 214, 156, .10)); }
  .part { position: relative; color: var(--ink); background: linear-gradient(160deg, var(--paper-1), var(--paper-2)); }
  .label {
    font-weight: 600; text-transform: uppercase; color: var(--ink-soft); letter-spacing: .18em; line-height: 1.2;
  }
  .value { font-weight: 800; color: var(--ink); line-height: 1.08; letter-spacing: -.01em; }
  .sub { font-weight: 500; color: var(--ink-soft); line-height: 1.25; }
  .green { color: var(--accent-ink); }

  .field { display: flex; align-items: flex-start; }
  .ico {
    flex: none; display: grid; place-items: center; border-radius: 14px;
    background: rgba(26, 122, 71, .09);
  }
  .ico svg { fill: none; stroke: var(--accent-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .seats { display: flex; }
  .seat {
    display: grid; place-items: center; font-weight: 700;
    border-radius: 10px 10px 5px 5px;
    border: 1.5px solid rgba(17, 26, 21, .18); color: rgba(17, 26, 21, .35);
  }
  .seat.on { background: var(--accent-ink); border-color: var(--accent-ink); color: #fff; }

  .barcode { display: flex; align-items: stretch; }
  .barcode i { display: block; background: var(--ink); }

  .foot { display: flex; align-items: center; color: #cfd8d3; font-weight: 500; white-space: nowrap; }
  .foot b { color: #fff; font-weight: 700; }
  .foot svg { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* =================== STORY 1080x1920 =================== */
  body.story { --w: 1080px; --h: 1920px; }
  .story .beam { width: 1400px; height: 1250px; }
  .story .content { padding: 0 90px; }
  .story .eyebrow { font-size: 40px; letter-spacing: .3em; gap: 26px; }
  .story .eyebrow::before, .story .eyebrow::after { width: 90px; }
  .story .title { margin-top: 44px; }
  .story .t1 { font-size: 190px; letter-spacing: .05em; }
  .story .t2 { font-size: 84px; letter-spacing: .38em; margin-top: 10px; padding-left: .38em; }

  .story .ticket { flex-direction: column; width: 900px; margin-top: 76px; }
  .story .main {
    padding: 56px 58px 50px; border-radius: 30px 30px 0 0;
    -webkit-mask:
      radial-gradient(circle 28px at 0 100%, #0000 97%, #000) 0 0 / 51% 100% no-repeat,
      radial-gradient(circle 28px at 100% 100%, #0000 97%, #000) 100% 0 / 51% 100% no-repeat;
  }
  .story .main::after {
    content: ""; position: absolute; left: 44px; right: 44px; bottom: 0; height: 2px;
    background-image: linear-gradient(90deg, rgba(17, 26, 21, .28) 55%, transparent 0);
    background-size: 20px 2px;
  }
  .story .stub {
    padding: 48px 58px 50px; border-radius: 0 0 30px 30px;
    -webkit-mask:
      radial-gradient(circle 28px at 0 0, #0000 97%, #000) 0 0 / 51% 100% no-repeat,
      radial-gradient(circle 28px at 100% 0, #0000 97%, #000) 100% 0 / 51% 100% no-repeat;
  }
  .story .grid { display: grid; grid-template-columns: 1fr; gap: 38px; }
  .story .wide { grid-column: 1 / -1; }
  .story .field { gap: 22px; }
  .story .ico { width: 72px; height: 72px; }
  .story .ico svg { width: 38px; height: 38px; }
  .story .label { font-size: 20px; margin-bottom: 8px; }
  .story .value { font-size: 48px; }
  .story .sub { font-size: 26px; margin-top: 6px; }
  .story .seats { gap: 10px; margin-top: 30px; justify-content: space-between; }
  .story .seat { width: 72px; height: 64px; font-size: 22px; }
  .story .stub-bottom { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 38px; }
  .story .qty .value { font-size: 44px; }
  .story .barcode { height: 86px; }
  .story .foot { margin-top: 70px; font-size: 34px; gap: 18px; }
  .story .foot svg { width: 44px; height: 44px; }

  /* =================== SQUARE 1080x1080 =================== */
  body.square { --w: 1080px; --h: 1080px; }
  .square .beam { width: 1200px; height: 800px; }
  .square .content { padding: 0 64px; }
  .square .eyebrow { font-size: 30px; letter-spacing: .3em; gap: 22px; }
  .square .eyebrow::before, .square .eyebrow::after { width: 70px; }
  .square .title { margin-top: 26px; }
  .square .t1 { font-size: 132px; letter-spacing: .05em; }
  .square .t2 { font-size: 58px; letter-spacing: .38em; margin-top: 6px; padding-left: .38em; }

  .square .ticket { flex-direction: row; width: 952px; margin-top: 46px; }
  .square .main {
    flex: 1; padding: 40px 40px 38px; border-radius: 26px 0 0 26px;
    -webkit-mask:
      radial-gradient(circle 24px at 100% 0, #0000 97%, #000) 0 0 / 100% 51% no-repeat,
      radial-gradient(circle 24px at 100% 100%, #0000 97%, #000) 0 100% / 100% 51% no-repeat;
  }
  .square .main::after {
    content: ""; position: absolute; top: 36px; bottom: 36px; right: 0; width: 2px;
    background-image: linear-gradient(180deg, rgba(17, 26, 21, .28) 55%, transparent 0);
    background-size: 2px 18px;
  }
  .square .stub {
    width: 330px; padding: 40px 34px 34px; border-radius: 0 26px 26px 0;
    display: flex; flex-direction: column;
    -webkit-mask:
      radial-gradient(circle 24px at 0 0, #0000 97%, #000) 0 0 / 100% 51% no-repeat,
      radial-gradient(circle 24px at 0 100%, #0000 97%, #000) 0 100% / 100% 51% no-repeat;
  }
  .square .grid { display: grid; grid-template-columns: 1fr; gap: 22px; }
  .square .wide { grid-column: 1 / -1; }
  .square .field { gap: 16px; }
  .square .ico { width: 56px; height: 56px; border-radius: 12px; }
  .square .ico svg { width: 30px; height: 30px; }
  .square .label { font-size: 15px; margin-bottom: 6px; }
  .square .value { font-size: 34px; }
  .square .sub { font-size: 19px; margin-top: 4px; }
  .square .stub .value { font-size: 40px; }
  .square .seats { gap: 6px; margin-top: 22px; }
  .square .seat { width: 46px; height: 42px; font-size: 15px; border-radius: 8px 8px 4px 4px; }
  .square .stub-bottom { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; }
  .square .qty .value { font-size: 30px; }
  .square .barcode { height: 58px; }
  .square .foot { margin-top: 46px; font-size: 28px; gap: 14px; }
  .square .foot svg { width: 36px; height: 36px; }
  /* =================== MARKETPLACE 1200x1200 =================== */
  body.market { --w: 1200px; --h: 1200px; }
  .market .beam { width: 1300px; height: 900px; }
  .market .content { padding: 0 60px; }
  .market .eyebrow { font-size: 36px; letter-spacing: .3em; gap: 24px; }
  .market .eyebrow::before, .market .eyebrow::after { width: 80px; }
  .market .title { margin-top: 28px; }
  .market .t1 { font-size: 178px; letter-spacing: .05em; }
  .market .t2 { font-size: 76px; letter-spacing: .38em; margin-top: 8px; padding-left: .38em; }

  .market .ticket { flex-direction: row; width: 1080px; margin-top: 56px; }
  .market .main {
    flex: 1; padding: 46px 44px 44px; border-radius: 28px 0 0 28px;
    -webkit-mask:
      radial-gradient(circle 26px at 100% 0, #0000 97%, #000) 0 0 / 100% 51% no-repeat,
      radial-gradient(circle 26px at 100% 100%, #0000 97%, #000) 0 100% / 100% 51% no-repeat;
  }
  .market .main::after {
    content: ""; position: absolute; top: 40px; bottom: 40px; right: 0; width: 2px;
    background-image: linear-gradient(180deg, rgba(17, 26, 21, .28) 55%, transparent 0);
    background-size: 2px 18px;
  }
  .market .stub {
    width: 400px; padding: 46px 40px 40px; border-radius: 0 28px 28px 0;
    display: flex; flex-direction: column;
    -webkit-mask:
      radial-gradient(circle 26px at 0 0, #0000 97%, #000) 0 0 / 100% 51% no-repeat,
      radial-gradient(circle 26px at 0 100%, #0000 97%, #000) 0 100% / 100% 51% no-repeat;
  }
  .market .grid { display: grid; grid-template-columns: 1fr; gap: 28px; }
  .market .field { gap: 20px; }
  .market .ico { width: 66px; height: 66px; }
  .market .ico svg { width: 34px; height: 34px; }
  .market .label { font-size: 17px; margin-bottom: 6px; }
  .market .value { font-size: 44px; }
  .market .sub { font-size: 23px; margin-top: 4px; }
  .market .stub .qty .value { font-size: 58px; }
  .market .stub .seats-label { margin-top: 30px; }
  .market .seats { gap: 8px; margin-top: 14px; }
  .market .seat { width: 57px; height: 52px; font-size: 18px; border-radius: 9px 9px 5px 5px; }
  .market .stub .barcode { margin-top: auto; height: 62px; }
  .market .foot { margin-top: 54px; font-size: 32px; gap: 16px; }
  .market .foot svg { width: 40px; height: 40px; }
</style>
</head>
<body>
<div class="beam"></div>
<canvas id="dust"></canvas>
<div class="grain"></div>
<div class="content" id="content"></div>

<template id="tpl-icons">
  <svg data-i="cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
  <svg data-i="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
  <svg data-i="pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.6"/></svg>
  <svg data-i="seat" viewBox="0 0 24 24"><path d="M6 12V6a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v6"/><path d="M4 11h2v5h12v-5h2v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M7 19v2M17 19v2"/></svg>
  <svg data-i="chat" viewBox="0 0 24 24"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/></svg>
</template>

<script>
  const layout = new URLSearchParams(location.search).get('layout') || 'story';
  document.body.classList.add(layout);
  const icon = (n) => document.getElementById('tpl-icons').content.querySelector(`[data-i="${n}"]`).outerHTML;

  const field = (ic, label, value, sub, cls = '') => `
    <div class="field ${cls}"><div class="ico">${icon(ic)}</div><div>
      <div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ''}
    </div></div>`;

  const seats = () => {
    let s = '';
    for (let i = 1; i <= 9; i++) s += `<div class="seat${i >= 3 && i <= 7 ? ' on' : ''}">C${i}</div>`;
    return `<div class="seats">${s}</div>`;
  };

  const barcode = (n) => {
    let seed = 1612, s = '';
    const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < n; i++) s += `<i style="width:${1 + Math.floor(r() * 4)}px;margin-right:${1 + Math.floor(r() * 3)}px"></i>`;
    return `<div class="barcode">${s}</div>`;
  };

  const head = `
    <div class="eyebrow"><span style="margin-right:-.3em">Se venden entradas</span></div>
    <div class="title"><span class="t1">Avengers</span><span class="t2">Doomsday</span></div>`;
  const cta = layout === 'market' ? 'Envíame un mensaje' : 'Escríbeme por interno';
  const foot = `<div class="foot">${icon('chat')}<span>¿Te interesan? <b>${cta}</b></span></div>`;

  const fFecha = field('cal', 'Fecha', '16 de diciembre', 'Miércoles');
  const fHora = field('clock', 'Hora', '4:00 p.m.', '');
  const fCine = field('pin', 'Cine', 'Cinépolis', 'Mall Aventura Santa Anita', 'wide');

  const c = document.getElementById('content');
  if (layout === 'story') {
    c.innerHTML = `${head}
      <div class="ticket">
        <div class="part main"><div class="grid">${fFecha}${fHora}${fCine}</div></div>
        <div class="part stub">
          ${field('seat', 'Asientos · Fila C', 'C3 · C4 · C5 · C6 · <span class="green">C7</span>', '')}
          ${seats()}
          <div class="stub-bottom">
            <div class="qty"><div class="label">Cantidad</div><div class="value">5 entradas <span class="green">juntas</span></div></div>
            ${barcode(46)}
          </div>
        </div>
      </div>
      ${foot}`;
  } else if (layout === 'market') {
    c.innerHTML = `${head}
      <div class="ticket">
        <div class="part main"><div class="grid">${fFecha}${fHora}${fCine}</div></div>
        <div class="part stub">
          <div class="qty"><div class="label">Cantidad</div><div class="value">5 <span class="green">entradas</span></div></div>
          <div class="label seats-label">Asientos · Fila C</div>
          <div class="seats">${[3, 4, 5, 6, 7].map(i => `<div class="seat on">C${i}</div>`).join('')}</div>
          ${barcode(52)}
        </div>
      </div>
      ${foot}`;
  } else {
    c.innerHTML = `${head}
      <div class="ticket">
        <div class="part main"><div class="grid">${fFecha}${fHora}${fCine}</div></div>
        <div class="part stub">
          <div class="label">Asientos · Fila C</div>
          <div class="value">C3 al <span class="green">C7</span></div>
          <div class="seats">${[3, 4, 5, 6, 7].map(i => `<div class="seat on">C${i}</div>`).join('')}</div>
          <div class="stub-bottom">
            <div class="qty"><div class="label">Cantidad</div><div class="value">5 juntas</div></div>
            ${barcode(22)}
          </div>
        </div>
      </div>
      ${foot}`;
  }

  // a few quiet dust motes drifting in the projector light
  function paint() {
    const cv = document.getElementById('dust');
    const W = document.body.clientWidth, H = document.body.clientHeight;
    cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    let seed = 77;
    const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 90; i++) {
      const y = R() * H * .75;
      const spread = 80 + y * .55;
      const x = W / 2 + (R() - .5) * 2 * spread;
      const r = .6 + R() * 1.8;
      g.fillStyle = `rgba(220, 245, 230, ${.08 + R() * .22})`;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    document.body.dataset.ready = '1';
  }
  document.fonts.ready.then(() => requestAnimationFrame(paint));
</script>
</body>
</html>
